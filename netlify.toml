[build]
  command = "npm run build"
  publish = "dist"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-store, no-cache, must-revalidate, max-age=0"

[[headers]]
  for = "/version.json"
  [headers.values]
    Cache-Control = "no-store, no-cache, must-revalidate, max-age=0"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "no-cache, must-revalidate, max-age=0"

[[redirects]]
  from = "/track/assets/*"
  to = "/assets/:splat"
  status = 200

[[redirects]]
  from = "/track/*/assets/*"
  to = "/assets/:splat"
  status = 200

[[redirects]]
  from = "/track/version.json"
  to = "/version.json"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
